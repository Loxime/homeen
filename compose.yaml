services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${APP_TIMEZONE:-Europe/Paris}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      ACCESS_KEY: ${ACCESS_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost:8080/.well-known/mercure}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >-
      sh -c "npm install;
      if [ -f package-lock.json ]; then chown $${LOCAL_UID}:$${LOCAL_GID} package-lock.json 2>/dev/null || true; fi;
      exec npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

  mercure:
    image: dunglas/mercure:v0.24.2
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      USE_FORWARDED_HEADERS: "1"
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${HOMEEN_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/app/public:ro
    depends_on:
      - php
      - frontend
      - mercure
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    entrypoint: ["/usr/local/bin/homeen-scheduler"]
    environment:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      ACCESS_KEY: ${ACCESS_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost:8080/.well-known/mercure}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      php:
        condition: service_started
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:
  mercure_data:
  mercure_config:
